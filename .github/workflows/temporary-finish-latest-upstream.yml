name: Finalize new upstream ancestry on sync branch
on:
  push:
    branches: [sync/request-latest-upstream-20261116]
permissions:
  contents: write
jobs:
  merge:
    if: github.repository == 'AmirrezaFarnamTaheri/pi'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: sync/upstream-main
          fetch-depth: 0
      - name: Merge current upstream into review-only sync branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags https://github.com/earendil-works/pi.git refs/heads/main:refs/remotes/upstream/main
          git merge --no-edit refs/remotes/upstream/main
          git push origin HEAD:refs/heads/sync/upstream-main
