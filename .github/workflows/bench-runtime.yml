name: Runtime Performance Benchmarks
on:
  workflow_dispatch:
  schedule:
    - cron: "13 3 * * 6"

permissions:
  contents: read

jobs:
  benchmark:
    if: ${{ github.repository == 'AmirrezaFarnamTaheri/pi' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Hydrate pinned model data
        run: npm run hydrate:model-data

      - name: Build production modules
        run: npm run build:offline

      - name: Measure real session operations
        run: npm run bench:runtime -- --entries 12000 --samples 12 --warmups 3 --output .artifacts/runtime-benchmarks.json

      - name: Upload benchmark measurements
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-benchmarks
          path: .artifacts/runtime-benchmarks.json
          retention-days: 90
          if-no-files-found: error
