name: Format provider-manager changes
on:
  push:
    branches: [feat/provider-first-account-manager]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format touched feature files
        run: |
          ./node_modules/.bin/biome check --write \
            packages/coding-agent/src/core/account-provider-groups.ts \
            packages/coding-agent/src/core/account-profiles.ts \
            packages/coding-agent/src/core/model-runtime.ts \
            packages/coding-agent/src/modes/interactive/components/extension-selector.ts \
            packages/coding-agent/src/modes/interactive/interactive-mode.ts \
            packages/coding-agent/test/account-provider-groups.test.ts \
            packages/coding-agent/test/account-profiles.test.ts \
            packages/coding-agent/test/account-management-ui.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/coding-agent/src packages/coding-agent/test
          git diff --cached --quiet || (git commit -m "style: format provider manager changes" && git push)
