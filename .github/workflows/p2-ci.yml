# P2's slow browser/UI matrix is isolated from core Pi binary release validation.
# Failures remain visible in Actions; do not merge them into the fork-only release gate.
name: P2 extended CI

on:
  workflow_dispatch:
  push:
    branches: [main, "hardening/**", "perf/**", "sync/**", "ci/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: p2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The root package test matrix only covers packages/*, not apps/p2.
  # Keep the p2 virtual-list performance regression part of the PR gate.
  p2-virtual-list:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Virtual-list regression tests
        run: node --import ./src/source.ts --test test/p2/virtual-list.test.ts
        working-directory: apps/p2

  # p2 is an apps/* workspace, not covered by the root package matrix.
  p2-check-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate AI provider JSON before P2 source typecheck
        run: npm run generate:models

      - name: Check P2 types and formatting
        run: npm run check --workspace apps/p2

      - name: Test P2
        run: npm run test --workspace apps/p2

